name: release

# Obsidian community-plugin release convention: a GitHub release whose tag is
# the exact manifest version (no "v" prefix), with manifest.json and main.js
# attached as individual assets. Push a matching tag to cut a draft release.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check tag matches manifest version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_NAME" != "$MANIFEST_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME != manifest version $MANIFEST_VERSION" >&2
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            manifest.json main.js
